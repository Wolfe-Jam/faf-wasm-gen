[package]
name = "faf-wasm-gen"
version = "2.0.0"
authors = ["wolfejam <wolfejam.dev>"]
edition = "2021"
description = "FAF .faf generator — Rust→WASM. faf-cli v6.8 / faf_version 3.3, 33-slot Mk4. The generate sibling of faf-wasm-sdk."
license = "MIT"
repository = "https://github.com/Wolfe-Jam/faf-wasm-gen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["wasmbind"] }
regex = "1.10"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
strip = true        # Strip symbols from binary

[package.metadata.wasm-pack.profile.release]
# wasm-opt disabled: the system wasm-opt (Homebrew) can't process this crate's
# wasm (chrono+regex+serde_json pull in newer wasm features it rejects).
# Rust-level opt (opt-level="z" + lto + strip, above) still applies.
# Re-enable with a newer wasm-opt to shave further size.
wasm-opt = false
